name: Checkout Regression

# Runs against a shared public demo site, so it is scheduled rather than tied to
# every push: a site outage should not read as a broken commit.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run the suite
        run: mvn --batch-mode clean test

      - name: Upload the report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: target/test-evidence
